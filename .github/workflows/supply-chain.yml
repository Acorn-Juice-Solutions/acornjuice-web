name: Supply chain

# Three things this does that the deploy workflow does not:
#
#  1. Produces a CycloneDX SBOM of what actually ships, on every build.
#  2. Distinguishes malicious packages from vulnerable ones. A known-malicious
#     release fails the build; a CVE writes to the job summary and lets it
#     through. That asymmetry is deliberate — this repo's 11 open advisories
#     are all in @lhci/cli's dev-only tree and never reach the published site,
#     so gating on them would train us to ignore the signal.
#  3. Re-scans on a schedule. Advisories land against versions we already
#     shipped, and this repo can go weeks without a commit, so a push-only
#     scan would simply never notice.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily. Offset from the hour because everyone schedules on :00 and the
    # runner queue at that minute is measurably worse.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  OSV_SCANNER_VERSION: "2.6.0"
  OSV_SCANNER_SHA256: "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  dependencies:
    name: SBOM + dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      # npm ci is itself a lockfile integrity gate: it refuses to run when
      # package-lock.json and package.json disagree, so a hand-edited lock
      # fails here rather than silently resolving to something else.
      - name: Install (lockfile-exact, no install scripts)
        run: npm run ci:install

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: acornjuice-web.cdx.json
          output-file: acornjuice-web.cdx.json

      - name: Summarise SBOM
        run: |
          set -euo pipefail
          count=$(jq '[.components[]?] | length' acornjuice-web.cdx.json)
          echo "### SBOM" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$count\` components catalogued." >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -lt 10 ]; then
            echo "::error::SBOM has only $count components — syft probably failed to read the lockfile."
            exit 1
          fi

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          curl -fsSL "$url" -o /tmp/osv-scanner
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner

      # osv-scanner exits non-zero whenever it finds anything at all, so the
      # exit code alone cannot tell "malicious" from "outdated". We keep the
      # report and make that judgement ourselves.
      - name: Scan dependencies
        run: |
          set -uo pipefail
          /tmp/osv-scanner scan source --format json --output osv.json . || true
          test -s osv.json || echo '{"results":[]}' > osv.json

      - name: Block on malicious packages
        run: |
          set -euo pipefail
          # OSV carries the OpenSSF malicious-packages feed under MAL- ids.
          # These are packages published to attack consumers, not packages with
          # a bug — there is no version of this we are willing to ship.
          jq -r '
            [ .results[]?.packages[]?
              | .package.name as $pkg
              | .vulnerabilities[]?
              | ([.id] + (.aliases // []))[]
              | select(startswith("MAL-"))
              | "\($pkg)\t\(.)"
            ] | unique | .[]
          ' osv.json > malicious.txt || true

          if [ -s malicious.txt ]; then
            {
              echo "### Malicious packages detected"
              echo ""
              echo "| Package | Advisory |"
              echo "| --- | --- |"
              awk -F'\t' '{printf "| `%s` | %s |\n", $1, $2}' malicious.txt
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Known-malicious package present in the dependency tree."
            cat malicious.txt
            exit 1
          fi
          echo "No known-malicious packages." >> "$GITHUB_STEP_SUMMARY"

      - name: Report vulnerabilities (non-blocking)
        run: |
          set -euo pipefail
          jq -r '
            [ .results[]?.packages[]?
              | .package.name as $pkg
              | .package.version as $ver
              | .vulnerabilities[]?
              | "\($pkg)\t\($ver)\t\(.id)\t\((.summary // "") | gsub("[|\n]"; " ") | .[0:90])"
            ] | unique | .[]
          ' osv.json > vulns.txt || true

          n=$(wc -l < vulns.txt | tr -d ' ')
          {
            echo "### Vulnerabilities: $n"
            echo ""
            if [ "$n" -gt 0 ]; then
              echo "Advisory only — these do not fail the build. Triage them in the"
              echo "weekly Dependabot pass; anything reachable from shipped code"
              echo "should be fixed, anything dev-only can wait."
              echo ""
              echo "| Package | Version | Advisory | Summary |"
              echo "| --- | --- | --- | --- |"
              awk -F'\t' '{printf "| `%s` | %s | %s | %s |\n", $1, $2, $3, $4}' vulns.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Registry signatures and provenance (non-blocking)
        run: |
          set -uo pipefail
          # Worth recording, but not a malware control: a package published
          # from a stolen maintainer token is correctly signed. Provenance
          # attestation coverage is still a minority of the tree.
          npm audit signatures 2>&1 | tee sig.txt || true
          {
            echo "### Registry signatures"
            echo '```'
            tail -5 sig.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-reports
          path: |
            acornjuice-web.cdx.json
            osv.json
          if-no-files-found: warn
          retention-days: 90

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: a secret that was committed and later removed is
          # still a leaked secret, and it is the one people forget about.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Scan history for secrets
        run: /tmp/gitleaks git --redact --verbose --exit-code 1 .

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pipx install zizmor

      # Catches template injection, over-broad permissions and actions pinned
      # to a mutable tag — the tj-actions/changed-files class of compromise.
      - name: Audit workflows
        run: zizmor --no-progress --min-severity high --persona regular .github/workflows/
